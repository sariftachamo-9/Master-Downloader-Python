<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="masterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#06b6d4" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Hexagonal / Shield Outer Frame -->
  <polygon points="50,4 92,26 92,74 50,96 8,74 8,26" fill="#090d16" stroke="url(#masterGrad)" stroke-width="3.5" filter="url(#shadow)" />

  <!-- Inner Geometric Accent -->
  <polygon points="50,12 84,30 84,70 50,88 16,70 16,30" fill="rgba(6, 182, 212, 0.06)" stroke="url(#glowGrad)" stroke-width="1.5" stroke-dasharray="4,2" />

  <!-- Master Crown / M Top Icon -->
  <path d="M34,34 L42,46 L50,34 L58,46 L66,34 L66,42 L50,54 L34,42 Z" fill="url(#masterGrad)" />

  <!-- Core Downloader Arrow -->
  <path d="M50,48 L50,68 M40,60 L50,70 L60,60" fill="none" stroke="url(#glowGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Bottom Base Line -->
  <line x1="36" y1="78" x2="64" y2="78" stroke="url(#masterGrad)" stroke-width="3.5" stroke-linecap="round" />
</svg>
